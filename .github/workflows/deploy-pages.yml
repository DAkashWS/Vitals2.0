# Builds the website and publishes it to GitHub Pages on every push to the default branch.
# One-time setup by the repo owner: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Live at https://dakashws.github.io/Vitals2.0/

name: Deploy website to GitHub Pages

on:
  push:
    branches: [main, claude/magical-brahmagupta-rtw50x]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Public by design (the publishable key ships in every page); the database's
          # Row Level Security decides what each signed-in person can read or write.
          VITE_SUPABASE_URL: https://grqwdnpudnjhehetrryz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_PsUjpmuymofPXh8FMFy52g_d2s1O8-O
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
